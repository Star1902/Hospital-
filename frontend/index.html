<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Hospitalar - Login</title>
<link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="container">
  <h2>🏥 Sistema Hospitalar</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
  <div id="mensagem-erro"></div>
</div>

<script>
function login() {
  const usuarioInput = document.getElementById("usuario").value.trim();
  const senhaInput = document.getElementById("senha").value.trim();
  const msgErro = document.getElementById("mensagem-erro");

  if (!usuarioInput || !senhaInput) {
    msgErro.textContent = "Preencha usuário e senha.";
    msgErro.style.display = "block";
    return;
  }

  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      usuario: usuarioInput,
      senha: senhaInput
    })
  })
  .then(async response => {
    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.erro || "Usuário ou senha incorretos.");
    }
    return response.json();
  })
  .then(data => {
    // Redireciona de acordo com o tipo do usuário retornado
    if (data.tipo === "triagem") location.href = "triagem.html";
    else if (data.tipo === "medico") location.href = "medico.html";
    else if (data.tipo === "atendimento") location.href = "atendimento.html";
    else location.href = "atendimento.html";
  })
  .catch(err => {
    msgErro.textContent = err.message;
    msgErro.style.display = "block";
  });
}
</script>
</body>
</html>
