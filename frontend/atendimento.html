<!DOCTYPE html>
<html>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 15px;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #e8f1ff, #f7faff);
  color: #1f2937;
}

.container {
  width: 100%;
  max-width: 650px;
  padding: 35px;
  background: #ffffff;
  border-radius: 18px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
}

h2 {
  margin-bottom: 28px;
  text-align: center;
  color: #1d4ed8;
  font-size: 30px;
  font-weight: 700;
}

h3 {
  margin: 28px 0 15px;
  padding-bottom: 10px;
  border-bottom: 2px solid #e5e7eb;
  color: #374151;
  font-size: 18px;
}

input,
select {
  width: 100%;
  height: 48px;
  margin-bottom: 14px;
  padding: 0 15px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  background: #f9fafb;
  color: #374151;
  font-size: 15px;
  outline: none;
  transition: 0.2s ease;
}

input::placeholder {
  color: #9ca3af;
}

input:focus,
select:focus {
  border-color: #2563eb;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

select {
  cursor: pointer;
}

button {
  width: 100%;
  height: 50px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s ease;
  box-shadow: 0 6px 15px rgba(37, 99, 235, 0.25);
}

button:hover {
  background: linear-gradient(135deg, #1d4ed8, #1e40af);
  transform: translateY(-1px);
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.30);
}

button:active {
  transform: translateY(0);
}

@media (max-width: 600px) {
  body {
    padding: 15px;
  }

  .container {
    padding: 25px 20px;
    border-radius: 14px;
  }

  h2 {
    font-size: 25px;
  }
}

</style>
<body>
<div class="container">
<h2>Atendimento</h2>

<input id="nome" placeholder="Nome">
<input id="cpf" placeholder="CPF">

<input id="dataNascimento" type="date" placeholder="Data de nascimento">

<select id="sexo">
  <option value="">Sexo</option>
  <option>Masculino</option>
  <option>Feminino</option>
  <option>Outro</option>
</select>

<input id="nomeMae" placeholder="Nome da mãe">
<input id="nomePai" placeholder="Nome do pai">

<select id="estadoCivil">
  <option value="">Estado civil</option>
  <option>Solteiro(a)</option>
  <option>Casado(a)</option>
  <option>Divorciado(a)</option>
  <option>Viúvo(a)</option>
  <option>União estável</option>
</select>

<input id="endereco" placeholder="Endereço">
<input id="telefone" placeholder="Telefone">
<input id="email" type="email" placeholder="E-mail">

<h3>Contato de emergência</h3>

<input id="contatoEmergencia" placeholder="Nome do contato de emergência">
<input id="telefoneEmergencia" placeholder="Telefone de emergência">

<select id="tipo">
  <option>Convenio</option>
  <option>Particular</option>
</select>

<button onclick="cadastrar()">Cadastrar</button>
</div>

<script>
function cadastrar(){
 fetch("http://localhost:3000/atendimento",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body: JSON.stringify({
    nome: nome.value,
    cpf: cpf.value,
    dataNascimento: dataNascimento.value,
    sexo: sexo.value,
    nomeMae: nomeMae.value,
    nomePai: nomePai.value,
    estadoCivil: estadoCivil.value,
    endereco: endereco.value,
    telefone: telefone.value,
    email: email.value,
    contatoEmergencia: contatoEmergencia.value,
    telefoneEmergencia: telefoneEmergencia.value,
    tipo: tipo.value
  })
 });
 alert("Paciente enviado para triagem");
}
</script>
</body>
</html>
