<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triagem Hospitalar</title>
<link rel="stylesheet" href="/css/triagem.css">
<style>
  /* Layout de Duas Colunas */
  .triagem-grid {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  
  .coluna-fila {
    flex: 1;
    background: #f8fafc;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
  }

  .coluna-form {
    flex: 1.2;
    background: #ffffff;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .fila-item {
    background: #fff;
    border: 1px solid #cbd5e1;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .fila-item.selecionado {
    border-color: #3182ce;
    background-color: #ebf8ff;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 4px;
    color: #4a5568;
  }

  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    box-sizing: border-box;
  }

  .btn-tv {
    background-color: #3182ce;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }

  .btn-tv:hover {
    background-color: #2b6cb0;
  }

  .btn-salvar {
    width: 100%;
    background-color: #38a169;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .btn-salvar:hover {
    background-color: #2f855a;
  }

  /* Tags de Risco */
  #resultado {
    padding: 10px;
    border-radius: 4px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 12px;
    display: none;
  }
  .risco-vermelho { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
  .risco-amarelo { background-color: #fefcbf; color: #975a16; border: 1px solid #faf089; }
  .risco-verde { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
</style>
</head>
<body>
<div class="container">

  <!-- Cabeçalho -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0; color:#1a365d;">🏥 Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
  </div>

  <div class="triagem-grid">
    
    <!-- Coluna Esquerda: Lista de Pacientes -->
    <div class="coluna-fila">
      <h3 style="margin-top:0; color:#2d3748;">
        Fila do Atendimento
      </h3>
      <p style="font-size:12px; color:#718096; margin-bottom:12px;">Clique em "Chamar na TV" para iniciar o atendimento do paciente.</p>
      
      <div id="fila-pacientes">
        <p style="color:#888; text-align:center;">Carregando...</p>
      </div>

      <button onclick="carregarPacientes()" style="margin-top:10px; width:100%; background:#6c757d; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer; font-size:13px;">🔄 Atualizar Fila</button>
    </div>

    <!-- Coluna Direita: Formulário do Enfermeiro -->
    <div class="coluna-form">
      <h3 style="margin-top:0; color:#2d3748; margin-bottom:15px;">Ficha de Avaliação da Triagem</h3>
      
      <div class="form-group">
        <label>Paciente Selecionado *</label>
        <input id="nome" placeholder="Selecione um paciente na lista ao lado" readonly style="background-color: #edf2f7; font-weight: bold;">
      </div>

      <div class="form-group">
        <label>Sintoma / Queixa Principal *</label>
        <select id="sintoma">
          <option value="">Selecione o sintoma principal</option>
          <option value="dor_leve">Dor leve</option>
          <option value="resfriado">Resfriado</option>
          <option value="coriza">Coriza</option>
          <option value="tosse">Tosse</option>
          <option value="febre">Febre</option>
          <option value="vomito">Vômito</option>
          <option value="diarreia">Diarreia</option>
          <option value="falta_ar_moderada">Falta de ar moderada</option>
          <option value="falta_ar_grave">Falta de ar grave</option>
          <option value="infarto">Suspeita de infarto</option>
          <option value="avc">Suspeita de AVC</option>
          <option value="convulsao">Convulsão</option>
          <option value="hemorragia">Hemorragia</option>
        </select>
      </div>

      <div class="form-group">
        <label>Temperatura (°C) *</label>
        <input id="temp" type="number" step="0.1" placeholder="Ex: 36.5">
      </div>

      <div class="form-group">
        <label>Alergias Conhecidas</label>
        <input id="alergia" placeholder="Ex: Dipirona, Penicilina, Nenhuma">
      </div>

      <div class="form-group">
        <label>Observações / Sinais Vitais</label>
        <textarea id="observacao" rows="3" placeholder="Pressão arterial, batimentos cardíacos, histórico..."></textarea>
      </div>

      <div id="resultado"></div>

      <button class="btn-salvar" onclick="salvar()">Concluir Triagem e Enviar ao Médico</button>
    </div>

  </div>

</div>

<script>
let pacienteAtual = null;

function carregarPacientes() {
  fetch("/pacientes")
    .then(r => r.json())
    .then(pacientes => {
      const div = document.getElementById("fila-pacientes");

      // Filtra os pacientes com status "triagem"
      const fila = pacientes.filter(p => p.status === "triagem");

      if (fila.length === 0) {
        div.innerHTML = "<p style='color:#888; text-align:center; padding:20px 0;'>Nenhum paciente aguardando.</p>";
        return;
      }

      div.innerHTML = "";
      fila.forEach(p => {
        const item = document.createElement("div");
        item.className = "fila-item";
        if (pacienteAtual && pacienteAtual.id === p.id) {
          item.classList.add("selecionado");
        }

        item.innerHTML = `
          <div>
            <strong>${p.nome}</strong><br>
            <small style="color:#718096;">CPF: ${p.cpf || "—"} | ${p.tipo || "Geral"}</small>
          </div>
          <button class="btn-tv" onclick='selecionarEChamar(${JSON.stringify(p)})'>📺 Chamar na TV</button>
        `;
        div.appendChild(item);
      });
    })
    .catch(() => {
      document.getElementById("fila-pacientes").innerHTML =
        "<p style='color:red; text-align:center;'>Erro ao carregar pacientes.</p>";
    });
}

// Quando clica em "Chamar na TV": envia para a TV e preenche a ficha do enfermeiro
function selecionarEChamar(paciente) {
  pacienteAtual = paciente;
  
  // Preenche o campo de nome no formulário da direita
  document.getElementById("nome").value = paciente.nome;

  // Atualiza destaque na lista
  carregarPacientes();

  // Envia a chamada para o backend/TV
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "GUICHÊ",
      localNumero: "01",
      paciente: paciente.nome
    })
  })
  .then(r => r.json())
  .then(() => {
    console.log("Chamada enviada para a TV!");
  })
  .catch(err => console.error("Erro ao chamar na TV:", err));
}

function classificarRisco(sintoma, temperatura) {
  const vermelhos = ["infarto","avc","convulsao","hemorragia","falta_ar_grave"];
  const amarelos = ["febre","vomito","diarreia","falta_ar_moderada"];
  if (temperatura >= 39) return "vermelho";
  if (vermelhos.includes(sintoma)) return "vermelho";
  if (amarelos.includes(sintoma)) return "amarelo";
  return "verde";
}

function salvar() {
  const nome = document.getElementById("nome").value;
  const sintoma = document.getElementById("sintoma").value;
  const temperatura = Number(document.getElementById("temp").value);
  const alergia = document.getElementById("alergia").value;
  const observacao = document.getElementById("observacao").value;

  if (!pacienteAtual || !pacienteAtual.id) {
    alert("Por favor, selecione um paciente da lista clicando em 'Chamar na TV'.");
    return;
  }

  if (!sintoma || !temperatura) {
    alert("Por favor, preencha o Sintoma e a Temperatura do paciente.");
    return;
  }

  const risco = classificarRisco(sintoma, temperatura);

  fetch("/triagem", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      pacienteId: pacienteAtual.id,
      nome, 
      sintoma, 
      temperatura, 
      alergia, 
      observacao, 
      risco 
    })
  })
  .then(async response => {
    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.message || `Erro HTTP ${response.status}`);
    }
    return response.json();
  })
  .then(data => {
    const resultado = document.getElementById("resultado");
    resultado.className = "risco-" + risco;
    resultado.style.display = "block";
    resultado.innerHTML = "Classificação de Risco: " + risco.toUpperCase();

    alert("Triagem concluída com sucesso! Paciente encaminhado para o Médico.");

    // Limpa o formulário
    document.getElementById("nome").value = "";
    document.getElementById("sintoma").value = "";
    document.getElementById("temp").value = "";
    document.getElementById("alergia").value = "";
    document.getElementById("observacao").value = "";
    pacienteAtual = null;

    // Recarrega a lista
    carregarPacientes();
  })
  .catch(err => {
    console.error("Erro detalhado:", err);
    alert("Erro ao salvar triagem: " + err.message);
  });
}

// Carrega a fila inicial ao abrir
carregarPacientes();

// Atualiza a lista a cada 10 segundos
setInterval(carregarPacientes, 10000);
</script>

</body>
</html>
